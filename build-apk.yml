name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android scaffolding (لو فولدر android مش موجود)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.maliktawla --project-name malik_tawla /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Patch AndroidManifest (INTERNET + اسم التطبيق)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          sed -i 's|android:label="[^"]*"|android:label="ملك الطاولة"|' "$M"

      - name: امسح اختبار flutter الافتراضي لو لسه موجود
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp(' test/widget_test.dart; then rm test/widget_test.dart; fi

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Analyze (معلوماتي بس)
        run: flutter analyze || true

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk malik-tawla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: malik-tawla-apk
          path: malik-tawla.apk

      - name: Publish release (عند عمل tag زي v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: malik-tawla.apk
          generate_release_notes: true
